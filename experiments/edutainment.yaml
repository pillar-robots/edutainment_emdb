Experiment:
    name: main_loop
    class_name: cognitive_processes.main_loop.MainLoop
    new_executor: True
    threads: 2
    parameters: 
        iterations: 100 #10000 # 100
        trials: 20
        subgoals: False
        softmax_selection: False #True # False
        softmax_temperature: 0.3
        kill_on_finish: True
Control:
    id: ltm_simulator
    control_topic: /main_loop/control
    control_msg: cognitive_processes_interfaces.msg.ControlMsg
    episodes_topic: /main_loop/episodes
    episodes_msg: cognitive_processes_interfaces.msg.Episode
    #executed_policy_service: /emdb/simulator/executed_policy # Commented
    executed_policy_msg: cognitive_node_interfaces.srv.Policy
    #world_reset_service: /emdb/simulator/world_reset # Commented
    world_reset_msg: cognitive_processes_interfaces.srv.WorldReset
LTM:
    Files:
        -
            id: goodness
            class: core.file.FileGoodness
            file: goodness.txt
        -
            id: pnodes_success
            class: core.file.FilePNodesSuccess
            file: pnodes_success.txt
        -
            id: pnodes_content
            class: core.file.FilePNodesContent
            file: pnodes_content.txt
        -
            id: pnodes_content_last_iteration
            class: core.file.FileLastIterationPNodesContent
            file: pnodes_content_last_ite.txt
        -
            id: goals_content
            class: core.file.FileGoalsContent
            file: goals_content.txt
        -
            id: goals_content_last_iteration
            class: core.file.FileLastIterationGoalsContent
            file: goals_content_last_ite.txt
        -
            id: trials
            class: core.file.FileTrialsSuccess
            file: trials.txt
        -
            id: neighbors
            class: core.file.FileNeighbors
            file: neighbors.txt
        -
            id: neighbors_full
            class: core.file.FileNeighborsFull
            file: neighbors_full.txt
    Connectors:
        -
            data: Space
            default_class: cognitive_nodes.space.ANNSpace #SVMSpace # cognitive_nodes.space.ANNSpace
        -
            data: Perception
            default_class: cognitive_nodes.perception.Perception
        -
            data: PNode
            default_class: cognitive_nodes.pnode.PNode
        -
            data: CNode
            default_class: cognitive_nodes.cnode.CNode
        -
            data: Goal
            default_class: cognitive_nodes.goal.GoalLearnedSpace # cognitive_nodes.goal.GoalLearnedSpace
        -
            data: WorldModel
            default_class: cognitive_nodes.world_model.WorldModel
        -
            data: Policy
            default_class: cognitive_nodes.policy.PolicyBlocking #Policy # cognitive_nodes.policy.PolicyBlocking
    Nodes:
        Perception:
            -
                name: teacher_present_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /teacher/is_present
            -
                name: teacher_type_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /teacher/type
            -
                name: student_type_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /student/type
            -
                name: challenge_completion_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /student/challenge_completion
            -
                name: python_errors_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /student/metrics/python_errors
            -
                name: evaluation_errors_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /student/metrics/evaluation_error_streak
            -
                name: error_streak_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /student/metrics/error_streak
            -
                name: bored_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /student/bored
            -
                name: standing_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /student/standing
        WorldModel:
            -
                name: EXPERT_WM #WM1
                class_name: edutainment_emdb.world_models.EdutainmentStudentExpert
                parameters:
                    neighbors: [{"name": "student_type_perception", "node_type": "Perception"}]
            -
                name: AMATEUR_WM #WM2
                class_name: edutainment_emdb.world_models.EdutainmentStudentAmateur
                parameters:
                    neighbors: [{"name": "student_type_perception", "node_type": "Perception"}]
            -
                name: GENERAL_WM #WM3
                class_name: edutainment_emdb.world_models.EdutainmentStudentGeneral
                parameters:
                    neighbors: [{"name": "student_type_perception", "node_type": "Perception"}]
        RobotPurpose: 
            -
                name: student_exercise_teacher_old_present_purpose # M1.1
                class_name: cognitive_nodes.robot_purpose.RobotPurpose
                parameters:
                    weight: 1.0 #0.9
                    drive_id: 'student_exercise_teacher_old_present_drive'
                    purpose_type: 'Mission'
                    terminal: False
            -
                name: student_exercise_teacher_modern_present_purpose # M2.1
                class_name: cognitive_nodes.robot_purpose.RobotPurpose
                parameters:
                    weight: 0.0 #0.9
                    drive_id: 'student_exercise_teacher_modern_present_drive'
                    purpose_type: 'Mission'
                    terminal: False
            -
                name: student_exercise_teacher_old_absent_purpose # M3.1
                class_name: cognitive_nodes.robot_purpose.RobotPurpose
                parameters:
                    weight: 0.0 #0.9
                    drive_id: 'student_exercise_teacher_old_absent_drive'
                    purpose_type: 'Mission'
                    terminal: False
            -
                name: student_exercise_teacher_modern_absent_purpose # M4.1
                class_name: cognitive_nodes.robot_purpose.RobotPurpose
                parameters:
                    weight: 0.0 #0.9
                    drive_id: 'student_exercise_teacher_modern_absent_drive'
                    purpose_type: 'Mission'
                    terminal: False
        Drive:
            -
                name: student_exercise_teacher_old_present_drive # D1.1
                class_name: cognitive_nodes.drive.DriveExponential
                parameters:
                    input_topic: /student/challenge_completion
                    input_msg: std_msgs.msg.Float32
                    min_eval: 0.8
                    neighbors: [{"name": "student_exercise_teacher_old_present_purpose", "node_type": "RobotPurpose"}]
            -
                name: student_exercise_teacher_modern_present_drive # D2.1
                class_name: cognitive_nodes.drive.DriveExponential
                parameters:
                    input_topic: /student/challenge_completion
                    input_msg: std_msgs.msg.Float32
                    min_eval: 0.8
                    neighbors: [{"name": "student_exercise_teacher_modern_present_purpose", "node_type": "RobotPurpose"}]
            -
                name: student_exercise_teacher_old_absent_drive # D3.1
                class_name: cognitive_nodes.drive.DriveExponential
                parameters:
                    input_topic: /student/challenge_completion
                    input_msg: std_msgs.msg.Float32
                    min_eval: 0.8
                    neighbors: [{"name": "student_exercise_teacher_old_absent_purpose", "node_type": "RobotPurpose"}]
            -
                name: student_exercise_teacher_modern_absent_drive # D4.1
                class_name: cognitive_nodes.drive.DriveExponential
                parameters:
                    input_topic: /student/challenge_completion
                    input_msg: std_msgs.msg.Float32
                    min_eval: 0.8
                    neighbors: [{"name": "student_exercise_teacher_modern_absent_purpose", "node_type": "RobotPurpose"}]
        Goal:
            -
                name: exercise_finished_goal #G1 #Needs also D3.1 and D4.1, or is that a different Goal?
                class_name: cognitive_nodes.goal.GoalMotiven
                parameters:
                    neighbors: [{"name": "student_exercise_teacher_old_present_drive", "node_type": "Drive"}, #D1.1
                                {"name": "student_exercise_teacher_modern_present_drive", "node_type": "Drive"}, #D2.1
                                {"name": "student_exercise_teacher_old_absent_drive", "node_type": "Drive"}, #D3.1
                                {"name": "student_exercise_teacher_modern_absent_drive", "node_type": "Drive"}] #D4.1
        PNode:
            -
                name: python_errors_pnode #Pn1.1
                class_name: edutainment_emdb.pnodes.PNodePythonErrors
                parameters:
                    space_class: cognitive_nodes.space.ActivatedDummySpace
                    neighbors: [{"name": "python_errors_perception", "node_type": "Perception"}]
            -
                name: evaluation_errors_pnode #Pn1.2
                class_name: edutainment_emdb.pnodes.PNodeEvaluationErrors
                parameters:
                    space_class: cognitive_nodes.space.ActivatedDummySpace
                    neighbors: [{"name": "evaluation_errors_perception", "node_type": "Perception"}]
            -
                name: python_evaluation_errors_present_pnode #Pn1.3
                class_name: edutainment_emdb.pnodes.PNodePythonEvaluationErrorsPresent
                parameters:
                    space_class: cognitive_nodes.space.ActivatedDummySpace
                    neighbors: [{"name": "python_errors_perception", "node_type": "Perception"}, {"name": "evaluation_errors_perception", "node_type": "Perception"}, {"name": "teacher_present_perception", "node_type": "Perception"}]
        CNode:
            -
                name: python_errors_expert_cnode # C1.1 EXPERT_WM
                class_name: cognitive_nodes.cnode.CNode
                parameters:
                    neighbors: [{"name": "exercise_finished_goal", "node_type": "Goal"}, {"name": "EXPERT_WM", "node_type": "WorldModel"}, {"name": "python_errors_pnode", "node_type": "PNode"}]
            -
                name: python_errors_amateur_cnode # C1.1 AMATEUR_WM
                class_name: cognitive_nodes.cnode.CNode
                parameters:
                    neighbors: [{"name": "exercise_finished_goal", "node_type": "Goal"}, {"name": "AMATEUR_WM", "node_type": "WorldModel"}, {"name": "python_errors_pnode", "node_type": "PNode"}]
            -
                name: evaluation_errors_expert_cnode # C1.2 EXPERT_WM
                class_name: cognitive_nodes.cnode.CNode
                parameters:
                    neighbors: [{"name": "exercise_finished_goal", "node_type": "Goal"}, {"name": "EXPERT_WM", "node_type": "WorldModel"}, {"name": "evaluation_errors_pnode", "node_type": "PNode"}]
            -
                name: evaluation_errors_amateur_cnode # C1.2 AMATEUR_WM
                class_name: cognitive_nodes.cnode.CNode
                parameters:
                    neighbors: [{"name": "exercise_finished_goal", "node_type": "Goal"}, {"name": "AMATEUR_WM", "node_type": "WorldModel"}, {"name": "evaluation_errors_pnode", "node_type": "PNode"}]
            -
                name: python_evaluation_errors_present_expert_cnode # C1.3 EXPERT_WM
                class_name: cognitive_nodes.cnode.CNode
                parameters:
                    neighbors: [{"name": "exercise_finished_goal", "node_type": "Goal"}, {"name": "EXPERT_WM", "node_type": "WorldModel"}, {"name": "python_evaluation_errors_present_pnode", "node_type": "PNode"}]
            -
                name: python_evaluation_errors_present_amateur_cnode # C1.3 AMATEUR_WM
                class_name: cognitive_nodes.cnode.CNode
                parameters:
                    neighbors: [{"name": "exercise_finished_goal", "node_type": "Goal"}, {"name": "AMATEUR_WM", "node_type": "WorldModel"}, {"name": "python_evaluation_errors_present_pnode", "node_type": "PNode"}]
        Policy:
            -
                name: skill_1_python_policy #S1
                class_name: edutainment_emdb.policies.PolicySkill1
                parameters:
                    neighbors: [{"name": "python_errors_expert_cnode", "node_type": "CNode"},
                                {"name": "python_errors_amateur_cnode", "node_type": "CNode"}]
            -
                name: skill_2_evaluation_policy #S2
                class_name: edutainment_emdb.policies.PolicySkill2
                parameters:
                    neighbors: [{"name": "evaluation_errors_expert_cnode", "node_type": "CNode"},
                                {"name": "evaluation_errors_amateur_cnode", "node_type": "CNode"}]
            -
                name: skill_3_teacher_policy #S3
                class_name: edutainment_emdb.policies.PolicySkill3
                parameters:
                    neighbors: [{"name": "python_evaluation_errors_present_expert_cnode", "node_type": "CNode"},
                                {"name": "python_evaluation_errors_present_amateur_cnode", "node_type": "CNode"}]
