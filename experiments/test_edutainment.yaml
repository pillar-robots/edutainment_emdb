Experiment:
    name: main_loop
    class_name: cognitive_processes.main_loop.MainLoop
    new_executor: True
    threads: 2
    parameters: 
        iterations: 10 #10000
        trials: 20
        subgoals: False
        softmax_selection: False #True
        softmax_temperature: 0.3
        kill_on_finish: True
Control:
    id: ltm_simulator
    control_topic: /main_loop/control
    control_msg: cognitive_processes_interfaces.msg.ControlMsg
    episodes_topic: /main_loop/episodes
    episodes_msg: cognitive_processes_interfaces.msg.Episode
    #executed_policy_service: /emdb/simulator/executed_policy # This service is only used by the simulator.
    executed_policy_msg: cognitive_node_interfaces.srv.Policy
    #world_reset_service: /emdb/simulator/world_reset # This service is only used by the simulator.
    world_reset_msg: cognitive_processes_interfaces.srv.WorldReset
LTM:
    Files:
        -
            id: goodness
            class: core.file.FileGoodness
            file: goodness.txt
        -
            id: pnodes_success
            class: core.file.FilePNodesSuccess
            file: pnodes_success.txt
        -
            id: pnodes_content
            class: core.file.FilePNodesContent
            file: pnodes_content.txt
        -
            id: pnodes_content_last_iteration
            class: core.file.FileLastIterationPNodesContent
            file: pnodes_content_last_ite.txt
        -
            id: goals_content
            class: core.file.FileGoalsContent
            file: goals_content.txt
        -
            id: goals_content_last_iteration
            class: core.file.FileLastIterationGoalsContent
            file: goals_content_last_ite.txt
        -
            id: trials
            class: core.file.FileTrialsSuccess
            file: trials.txt
        -
            id: neighbors
            class: core.file.FileNeighbors
            file: neighbors.txt
        -
            id: neighbors_full
            class: core.file.FileNeighborsFull
            file: neighbors_full.txt
    Connectors:
        -
            data: Space
            default_class: cognitive_nodes.space.ANNSpace #cognitive_nodes.space.SVMSpace
        -
            data: Perception
            default_class: cognitive_nodes.perception.Perception
        -
            data: PNode
            default_class: cognitive_nodes.pnode.PNode
        -
            data: CNode
            default_class: cognitive_nodes.cnode.CNode
        -
            data: Goal
            default_class: cognitive_nodes.goal.GoalLearnedSpace # cognitive_nodes.goal.Goal
        -
            data: WorldModel
            default_class: cognitive_nodes.world_model.WorldModel
        -
            data: Policy
            default_class: cognitive_nodes.policy.PolicyBlocking #cognitive_nodes.policy.Policy
    Nodes:
        Perception:
            -
                name: teacher_present_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /teacher/is_present
            -
                name: teacher_type_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /teacher/type
            -
                name: student_type_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /student/type
            -
                name: python_error_streak_perception
                class_name: edutainment_emdb.perceptions.EdutainmentPerception
                parameters:
                  default_msg: std_msgs.msg.Float32
                  default_topic: /student/metrics/python_error_streak
        WorldModel:
            -
                name: EXPERT_WM # WM1
                class_name: edutainment_emdb.world_models.EdutainmentStudentExpert
                parameters:
                    neighbors: [{"name": "student_type_perception", "node_type": "Perception"}]
        RobotPurpose: 
            ### MX.1
            -
                name: student_exercise_teacher_old_absent_purpose # M3.1
                class_name: cognitive_nodes.robot_purpose.RobotPurpose
                parameters:
                    weight: 1.0 #0.9
                    drive_id: 'student_exercise_teacher_old_absent_drive' # D3.1
                    purpose_type: 'Mission'
                    terminal: False
        Drive:
            ### DX.1
            -
                name: student_exercise_teacher_old_absent_drive # D3.1
                class_name: cognitive_nodes.drive.DriveExponential # DriveExponential: 0 active, 1 inactive (satisfied)
                parameters:
                    input_topic: /student/challenge_completion
                    input_msg: std_msgs.msg.Float32
                    min_eval: 0.8
                    neighbors: [{"name": "student_exercise_teacher_old_absent_purpose", "node_type": "RobotPurpose"}] # M3.1
        Goal:
            -
                name: exercise_finished_goal # G1 #TODO: Needs also D3.1 and D4.1, or is that a different Goal?
                class_name: cognitive_nodes.goal.GoalMotiven
                parameters:
                    neighbors: [{"name": "student_exercise_teacher_old_absent_drive", "node_type": "Drive"}] #D3.1
        PNode:
            ### Pn0
            -
                name: idle_pnode # Pn0
                class_name: edutainment_emdb.pnodes.PNodeIdle
                parameters:
                    space_class: cognitive_nodes.space.ActivatedDummySpace
                    neighbors: [{"name": "python_error_streak_perception", "node_type": "Perception"}]
            ### Pn1.X
            -
                name: python_errors_pnode # Pn1.1
                class_name: edutainment_emdb.pnodes.PNodePythonErrors
                parameters:
                    space_class: cognitive_nodes.space.ActivatedDummySpace
                    neighbors: [{"name": "python_error_streak_perception", "node_type": "Perception"}]
        CNode:
            ### C0
            -
                name: idle_expert_cnode # C0 IDLE EXPERT_WM
                class_name: cognitive_nodes.cnode.CNode
                parameters:
                    neighbors: [{"name": "EXPERT_WM", "node_type": "WorldModel"}, # WM1
                                {"name": "exercise_finished_goal", "node_type": "Goal"}, # G1
                                {"name": "idle_pnode", "node_type": "PNode"}] # Pn1.1
            ### C1.X
            -
                name: python_errors_expert_cnode # C1.1 EXPERT_WM
                class_name: cognitive_nodes.cnode.CNode
                parameters:
                    neighbors: [{"name": "EXPERT_WM", "node_type": "WorldModel"}, # WM1
                                {"name": "exercise_finished_goal", "node_type": "Goal"}, # G1
                                {"name": "python_errors_pnode", "node_type": "PNode"}] # Pn1.1
        Policy:
            -
                name: skill_0_idle_policy #S0
                class_name: edutainment_emdb.policies.PolicySkill0
                parameters:
                    neighbors: [{"name": "idle_expert_cnode", "node_type": "CNode"}]
            -
                name: skill_1_python_policy #S1
                class_name: edutainment_emdb.policies.PolicySkill1
                parameters:
                    neighbors: [{"name": "python_errors_expert_cnode", "node_type": "CNode"}] # C1.1 EXPERT_WM
            -
                name: skill_2_evaluation_policy #S2
                class_name: edutainment_emdb.policies.PolicySkill2
                parameters:
                    neighbors: [ ]
